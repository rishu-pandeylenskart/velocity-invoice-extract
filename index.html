<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invoice CSV Extractor</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:30px;color:#222}
.card{max-width:900px;margin:auto;background:white;border-radius:14px;padding:28px;box-shadow:0 4px 20px #0001}
h1{margin:0 0 8px}
p{color:#666}
.drop{border:2px dashed #777;border-radius:12px;padding:45px;text-align:center;cursor:pointer;margin:22px 0}
.drop.drag{background:#eef5ff;border-color:#2878d8}
button{border:0;border-radius:8px;padding:12px 20px;font-size:15px;cursor:pointer;margin-right:8px}
.primary{background:#1769e0;color:white}
.secondary{background:#eee}
button:disabled{opacity:.5;cursor:not-allowed}
#files{margin:15px 0}
.file{padding:7px 10px;border-bottom:1px solid #eee}
.status{margin-top:18px;padding:12px;background:#f3f3f3;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>Invoice CSV Extractor</h1>
<p>Select or drag multiple Excel invoices. The application creates <b>CSV only</b>.</p>

<div id="drop" class="drop">
  <b>Drop Excel files here</b><br><br>
  or click to choose multiple files<br>
  <small>.xls, .xlsx, .xlsm</small>
  <input id="picker" type="file" multiple accept=".xls,.xlsx,.xlsm" hidden>
</div>

<div id="files">No files selected.</div>

<button class="secondary" id="clear">Clear</button>
<button class="primary" id="run" disabled>Extract & Download CSV</button>

<div class="status" id="status">Ready.</div>
</div>

<script>
const drop=document.getElementById("drop");
const picker=document.getElementById("picker");
const filesBox=document.getElementById("files");
const run=document.getElementById("run");
const clear=document.getElementById("clear");
const status=document.getElementById("status");
let files=[];

drop.onclick=()=>picker.click();
picker.onchange=e=>addFiles([...e.target.files]);

["dragenter","dragover"].forEach(x=>drop.addEventListener(x,e=>{
  e.preventDefault(); drop.classList.add("drag");
}));
["dragleave","drop"].forEach(x=>drop.addEventListener(x,e=>{
  e.preventDefault(); drop.classList.remove("drag");
}));
drop.addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));

function addFiles(newFiles){
  files=[...files,...newFiles.filter(f=>/\.(xls|xlsx|xlsm)$/i.test(f.name))];
  const seen=new Set();
  files=files.filter(f=>!seen.has(f.name+"|"+f.size)&&seen.add(f.name+"|"+f.size));
  renderFiles();
}
function renderFiles(){
  filesBox.innerHTML=files.length
    ? files.map((f,i)=>`<div class="file">${i+1}. ${escapeHtml(f.name)}</div>`).join("")
    : "No files selected.";
  run.disabled=!files.length;
}
clear.onclick=()=>{files=[];picker.value="";renderFiles();status.textContent="Ready.";};

function clean(v){
  if(v===null||v===undefined)return "";
  return String(v).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
}
function norm(v){
  return clean(v).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
function num(v){
  if(typeof v==="number")return v;
  let s=clean(v).replace(/,/g,"").replace(/[^\d.-]/g,"");
  return s && s!=="-" ? Number(s)||0 : 0;
}
function dateValue(v){
  // SheetJS may return a Date-like value for legacy .xls files.
  // Do not rely on instanceof Date; some mobile/browser environments
  // can return a cross-realm Date object.
  if(v && typeof v.getFullYear === "function"){
    const y=v.getFullYear(), m=v.getMonth()+1, d=v.getDate();
    if(Number.isFinite(y) && Number.isFinite(m) && Number.isFinite(d)){
      return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }
  }

  // Excel serial date number.
  if(typeof v === "number" && Number.isFinite(v) && v > 0){
    const d=XLSX.SSF.parse_date_code(v);
    if(d && d.y){
      return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
    }
  }

  let s=clean(v);
  if(!s)return "";

  // If the cell is an object returned by a parser, try its text/value.
  if(typeof v === "object"){
    if(typeof v.w === "string") s=clean(v.w);
    else if(typeof v.v !== "undefined") s=clean(v.v);
  }

  let m;
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
  if(m){
    return `${m[3]}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  }
  m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  if(m){
    return `${m[1]}-${String(+m[2]).padStart(2,"0")}-${String(+m[3]).padStart(2,"0")}`;
  }

  // Common written date formats.
  const parsed=Date.parse(s);
  if(!Number.isNaN(parsed)){
    const d=new Date(parsed);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  return s;
}
function findSheet(wb){
  let best=null,bestScore=-1;
  for(const name of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""});
    let text=rows.slice(0,80).flat().map(norm).join(" | ");
    let score=0;
    if(text.includes("invoice no"))score+=3;
    if(text.includes("invoice date"))score+=2;
    if(text.includes("ship to party"))score+=3;
    if(text.includes("product service description")||text.includes("product description"))score+=4;
    if(text.includes("hsn sa code")||text.includes("hsn"))score+=2;
    if(score>bestScore){bestScore=score;best={name,rows};}
  }
  if(!best||bestScore<5)throw Error("Could not identify the invoice sheet.");
  return best;
}
function labelValue(rows,labels){
  const ps=labels.map(norm);
  for(const row of rows){
    for(let c=0;c<row.length;c++){
      const v=clean(row[c]), n=norm(v);
      if(ps.some(p=>n===p||n.includes(p))){
        if(v.includes(":")){
          const a=v.split(":").slice(1).join(":").trim();
          if(a)return a;
        }
        for(let j=c+1;j<Math.min(row.length,c+6);j++){
          const x=clean(row[j]);
          if(x && !ps.includes(norm(x)))return x;
        }
      }
    }
  }
  return "";
}
function currency(rows){
  for(const row of rows){
    const text=row.map(clean).join(" | ");
    let m=text.match(/(?:amount|rate|total\s+value)\s*\(\s*([A-Za-z]{3})\s*\)/i);
    if(m)return m[1].toUpperCase();
  }
  let x=labelValue(rows,["Currency of Invoice","Currency"]);
  let m=x.match(/\b[A-Za-z]{3}\b/);
  return m?m[0].toUpperCase():"";
}
function shipTo(rows){
  let r=-1;
  for(let i=0;i<rows.length;i++){
    if(/\bship\s*to\s*party\b|\bship\s*to\b/i.test(norm(rows[i].join(" | ")))){r=i;break}
  }
  if(r<0)return ["",""];
  let name="",address="";
  for(let i=r;i<Math.min(rows.length,r+9);i++){
    for(const raw of rows[i]){
      const v=clean(raw); if(!v)continue;
      if(/^name\s*:/i.test(v))name=v.replace(/^name\s*:\s*/i,"").trim();
      if(/^address(?: of delivery)?\s*[:\-]/i.test(v))
        address=v.replace(/^address(?: of delivery)?\s*[:\-]\s*/i,"").trim();
    }
  }
  // Fallback: take nearby non-label text, preserving the first plausible name/address.
  if(!name||!address){
    const vals=[];
    for(let i=r+1;i<Math.min(rows.length,r+8);i++)
      for(const x of rows[i])if(clean(x))vals.push(clean(x));
    if(!name)name=vals.find(x=>x.length<120&&!/^(address|country|city|state|zip|phone|email)\b/i.test(x))||"";
    if(!address){
      const start=vals.indexOf(name);
      address=vals.filter((x,j)=>j!==start).join(", ");
    }
  }
  return [name,address];
}
function itemHeader(rows){
  let best=null,scoreBest=-1;
  for(let r=0;r<rows.length;r++){
    const ns=rows[r].map(norm).join(" | ");
    let s=0;
    if(ns.includes("product service description")||ns.includes("product description"))s+=5;
    if(ns.includes("hsn"))s+=3;
    if(/\bqty\b|\bquantity\b/.test(ns))s+=2;
    if(ns.includes("box count")||ns.includes("no of boxes")||ns.includes("boxes"))s+=2;
    if(ns.includes("amount"))s+=2;
    if(s>scoreBest){scoreBest=s;best=r;}
  }
  if(scoreBest<7)throw Error("Could not find invoice item table.");
  return best;
}
function cols(row){
  const c={};
  row.forEach((v,i)=>{
    const h=norm(v);
    if(h.includes("product service description")||h.includes("product description")||h==="description"||h.includes("service description"))c.content??=i;
    else if(h.includes("hsn"))c.hsn??=i;
    else if(h==="qty"||h==="quantity"||h.startsWith("qty "))c.qty??=i;
    else if(h.includes("box count")||h.includes("no of boxes")||h.includes("number of boxes")||h==="boxes")c.box??=i;
    else if(h.includes("amount")&&!h.includes("discount"))c.amount??=i;
    else if(h.includes("total value"))c.total??=i;
  });
  return c;
}
function items(rows,h){
  const c=cols(rows[h]);
  for(const k of ["content","hsn","qty","amount"])
    if(c[k]===undefined)throw Error("Item table is missing "+k+".");
  let content="",hsn="",qty=0,box=0,amount=0,count=0;
  for(let r=h+1;r<rows.length;r++){
    const row=rows[r], joined=row.map(clean).join(" ");
    if(/^\s*total\b/i.test(joined))break;
    const ct=clean(row[c.content]), hc=clean(row[c.hsn]);
    if(!ct&&!hc)continue;
    if(!ct)continue;
    if(!content){content=ct;hsn=hc;}
    qty+=num(row[c.qty]);
    if(c.box!==undefined)box+=num(row[c.box]);
    amount+=num(row[c.amount]);
    count++;
  }
  if(!count)throw Error("No item rows found.");
  if(Math.abs(amount)<1e-12&&c.total!==undefined){
    amount=0;
    for(let r=h+1;r<rows.length;r++){
      const joined=rows[r].map(clean).join(" ");
      if(/^\s*total\b/i.test(joined))break;
      if(clean(rows[r][c.content]))amount+=num(rows[r][c.total]);
    }
  }
  return {content,hsn,qty,box,amount};
}
async function extract(file){
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:"array",cellDates:true});
  const {rows}=findSheet(wb);
  const it=items(rows,itemHeader(rows));
  const [name,address]=shipTo(rows);
  return {
    "Source File":file.name,
    "Invoice No":labelValue(rows,["Invoice No","Invoice Number","Invoice#"]),
    "Ref Number":labelValue(rows,["Ref Number","Reference Number","Reference No","Ref No"]),
    "Invoice Date":dateValue(labelValue(rows,["Invoice Date","Invoice date"])),
    "Content":it.content,
    "HSN":it.hsn,
    "Total QTY":it.qty,
    "Total Box":it.box,
    "Amount":Number(it.amount.toFixed(2)).toFixed(2),
    "Currency":currency(rows),
    "Ship To Party Name":name,
    "Ship To Party Address":address
  };
}
function esc(v){
  const s=String(v??"");
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadCSV(rows){
  const headers=Object.keys(rows[0]);
  const csv="\uFEFF"+[headers,...rows.map(r=>headers.map(h=>r[h]))]
    .map(row=>row.map(esc).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Invoice_Extract_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
run.onclick=async()=>{
  run.disabled=true;clear.disabled=true;
  const results=[],errors=[];
  for(let i=0;i<files.length;i++){
    status.textContent=`Processing ${i+1}/${files.length}: ${files[i].name}`;
    try{results.push(await extract(files[i]));}
    catch(e){errors.push(files[i].name+": "+e.message);}
  }
  if(errors.length){
    status.textContent="FAILED — no CSV downloaded.\n\n"+errors.join("\n");
    alert("One or more files failed. No CSV was downloaded.\n\n"+errors.join("\n"));
  }else{
    downloadCSV(results);
    status.textContent=`Completed: ${results.length} invoice(s) extracted. CSV downloaded.`;
  }
  run.disabled=false;clear.disabled=false;
};
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
</script>
</body>
</html>
